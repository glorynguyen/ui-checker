name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build both extensions
        run: npm run build

      - name: Run Chrome extension tests
        run: npm test

      - name: Run VS Code bridge tests
        run: cd vscode-bridge && npm test

      - name: Enforce coverage baseline (Chrome Extension)
        run: npm run test:coverage -- --lines=70 --functions=85 --branches=50
