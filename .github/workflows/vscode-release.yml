name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'vscode-bridge/**'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: |
          npm ci
          cd vscode-bridge && npm ci

      - name: Build bridge
        run: npm run build:bridge

      - name: Run Tests
        run: |
          cd vscode-bridge && npm run test:coverage

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd vscode-bridge && npx semantic-release
