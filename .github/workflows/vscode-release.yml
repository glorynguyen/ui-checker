name: Release VS Code Extension

on:
  push:
    branches:
      - main
    paths:
      - 'vscode-bridge/**'

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: |
          npm ci
          cd vscode-bridge && npm ci

      - name: Build bridge
        run: npm run build:bridge

      - name: Run Tests
        run: |
          cd vscode-bridge && npm run test:coverage

      - name: Sync release branch
        run: |
          git fetch origin main --tags
          git reset --hard origin/main

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd vscode-bridge && npm run release
